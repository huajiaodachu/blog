# Decap CMS 配置（网页后台）
# 只需改一处带【】的占位符：repo（你的 GitHub 用户名/仓库名）。
# client_id / client_secret 不放这里，存在 Cloudflare Pages 的环境变量里（更安全）。

backend:
  name: github
  repo: huajiaodachu/blog        # 【已填好：GitHub用户名/仓库名】
  branch: main
  base_url: https://blog.kaoshang.top   # 博客域名，OAuth 代理同源
  auth_endpoint: /auth                 # 对应 functions/auth.js
  scope: repo

publish_mode: simple            # 保存即直接发布（个人博客不需要审核流程）

media_folder: "static/uploads"  # 后台上传的图片存这里
public_folder: "/static/uploads"

collections:
  - name: "posts"
    label: "文章"
    label_singular: "一篇文章"
    folder: "content/posts"
    create: true
    slug: "{{fields.slug}}"      # 文章链接标识，用「网址标识」字段
    fields:
      - { name: title, label: "标题", widget: "string" }
      - { name: slug, label: "网址标识(英文/拼音，如 hai-you)", widget: "string", required: true, hint: "用于生成链接，避免中文链接乱码；例如 hai-you-hongchou" }
      - { name: category, label: "分类", widget: "select", options: [投资, 生活, 为人处世, 工作, 家庭] }
      - { name: tags, label: "标签(逗号分隔)", widget: "string", required: false, hint: "多个标签用逗号隔开，例如：中国海油, 港股, 安全边际" }
      - { name: date, label: "日期", widget: "date", required: false, format: "YYYY-MM-DD" }
      - { name: excerpt, label: "摘要(留空自动截取)", widget: "string", required: false }
      - { name: body, label: "正文", widget: "markdown" }
